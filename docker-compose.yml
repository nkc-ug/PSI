version: '3'
services:
  back:
    build:
      context: ../PSI/docker-back-dev/node.js
      dockerfile: dockerfile
    container_name: node.js
    tty: true
    volumes: 
      - ../PSI/docker-back-dev/node.js/node-project:/app
      - /app/node_modules  # node_modules はコンテナ内に保持(ホストとコンテナでnode_modulesを分ける。)
    ports:
      - "5000:5000" #<ホストポート>:<コンテナポート>
      - "5555:5555" #Prisma用
    depends_on:
      - db
    networks:
      - backend

  db:
    container_name: mysql
    image: mysql:8.0.23
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=user
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=psi
      - TZ=Asia/Tokyo
      # 永続ボリューム、コンテナ内のファイルと連動
    volumes:
      - ../PSI/docker-back-dev/mysql:/var/lib/mysql
    ports:
      - "3306:3306" #ホストポート:コンテナポート
    env_file: .env
    tty: true
    networks:
      - backend

  front:
    container_name: react
    build:
      context: ../PSI/docker-front-dev/react
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://back:5000 
    volumes:
      - ../PSI/docker-front-dev/react/psi-react:/app #ローカルファイルをコンテナにマウント
      - /app/node_modules #ホストのnode_modulesと、コンテナのnode_modulesの競合を防ぐ。
    networks:
      - frontend

networks:
  backend:
  frontend:
  default:


volumes:
  mysql-data:
